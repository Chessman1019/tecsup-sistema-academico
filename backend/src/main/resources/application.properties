spring.application.name=sistema-academico

# --- Conexion a Supabase (PostgreSQL via Session Pooler) ---
# Los valores reales van en variables de entorno, NO aqui
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- HikariCP ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# --- Servidor ---
server.port=8080
server.servlet.context-path=/api

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- Swagger: apagado por defecto, se activa solo en desarrollo ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.pe.edu.tecsup.sistemaacademico=INFO