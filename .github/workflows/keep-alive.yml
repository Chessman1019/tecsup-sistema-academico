name: Keep Alive - TECSUP

on:
  schedule:
    # Cada 10 minutos (mantiene Render despierto)
    - cron: '*/10 * * * *'
  workflow_dispatch:   # permite ejecutarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend en Render (despierta Render + toca Supabase)
        run: |
          echo "Haciendo ping al backend..."
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            https://tecsup-sistema-academico.onrender.com/api/auth/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"username":"keepalive","password":"keepalive","rol":"ADMIN"}' \
            || echo "Ping completado (respuesta de error es normal)"
          echo "Backend contactado correctamente."